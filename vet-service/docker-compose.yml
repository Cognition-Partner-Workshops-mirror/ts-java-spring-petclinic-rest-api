# Docker Compose for the Vet microservice.
# Default profile runs with embedded H2 (no external DB needed):
#   docker compose up vet-service
# PostgreSQL profile runs with an external PostgreSQL database:
#   docker compose --profile postgres up
services:
  vet-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL-backed vet-service instance (activated via --profile postgres)
  vet-service-postgres:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/vetservice
      - DATABASE_USERNAME=vetservice
      - DATABASE_PASSWORD=vetservice
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - postgres

  postgres:
    image: postgres:16.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vetservice
      - POSTGRES_PASSWORD=vetservice
      - POSTGRES_DB=vetservice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetservice -d vetservice"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

volumes:
  pgdata:
