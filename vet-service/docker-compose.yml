version: '3.8'

services:
  vet-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: vet-db
      DB_PORT: 5432
      DB_NAME: vetdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      vet-db:
        condition: service_healthy

  vet-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vet-db-data:
