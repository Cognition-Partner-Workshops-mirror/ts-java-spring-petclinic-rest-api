spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vetdb
    username: ${DB_USERNAME:vetservice}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.petclinic.vet: WARN
