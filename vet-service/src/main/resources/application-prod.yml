spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vetdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:vet_user}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.petclinic.vet: INFO
