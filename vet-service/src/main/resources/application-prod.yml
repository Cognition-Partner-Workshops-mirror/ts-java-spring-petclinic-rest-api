# Prod profile: external database configured via environment variables
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:vetdb}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.petclinic.vet: INFO
