spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vetdb
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:vetservice}
    password: ${DB_PASSWORD:vetservice}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.petclinic.vet: INFO
