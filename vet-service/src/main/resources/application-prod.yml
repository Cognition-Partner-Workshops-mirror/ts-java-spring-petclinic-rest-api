# Prod profile: configurable via environment variables
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:vetdb}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

logging:
  level:
    com.petclinic.vet: INFO
