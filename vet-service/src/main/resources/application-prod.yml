# Vet Service - Production profile (PostgreSQL)
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vetdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:vetservice}
    password: ${DATABASE_PASSWORD:}
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration

# Production logging
logging:
  level:
    com.petclinic.vet: INFO
    org.springframework.web: WARN
