# Common configuration for the Vet microservice
spring:
  application:
    name: vet-service
  profiles:
    active: dev
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /
