# Vet Service — shared configuration across all profiles
spring:
  application:
    name: vet-service
  # JPA defaults — overridden per profile below
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Flyway database migration settings
  flyway:
    enabled: true
    locations: classpath:db/migration

# Actuator health endpoint exposed for operational monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Server listens on port 8080 by default
server:
  port: 8080

---
# Dev profile — H2 in-memory database with seed data loaded via Flyway
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:vetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration,classpath:db/seed

---
# Test profile — H2 in-memory database without seed data for clean test isolation
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:vetdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration

---
# Prod profile — datasource configured via environment variables
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
