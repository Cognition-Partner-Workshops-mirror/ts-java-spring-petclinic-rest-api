# Common configuration for the Vet microservice
spring:
  application:
    name: vet-service
  profiles:
    active: dev
  # Flyway database migration configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Jackson serialization settings
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Actuator health and info endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Server configuration
server:
  port: 8080
  servlet:
    context-path: /
