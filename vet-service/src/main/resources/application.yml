spring:
  application:
    name: vet-service
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8083
  servlet:
    context-path: /petclinic/api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
