spring:
  application:
    name: vet-service
  profiles:
    active: dev
  jpa:
    open-in-view: false

server:
  port: 8081
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
