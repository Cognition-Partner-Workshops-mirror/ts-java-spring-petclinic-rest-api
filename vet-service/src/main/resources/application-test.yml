# Vet Service - Test profile (H2 in-memory database)
spring:
  datasource:
    url: jdbc:h2:mem:vetdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration

# Minimal logging during tests
logging:
  level:
    com.petclinic.vet: WARN
