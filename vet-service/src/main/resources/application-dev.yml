# Vet Service - Development profile (H2 in-memory database)
spring:
  datasource:
    url: jdbc:h2:mem:vetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration

# Logging configuration for development
logging:
  level:
    com.petclinic.vet: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
