<!-- Main application layout with Material toolbar navigation -->
<mat-toolbar color="primary" class="app-toolbar">
  <mat-icon class="app-logo">pets</mat-icon>
  <span class="app-title">{{ title }}</span>
  <span class="spacer"></span>
  <!-- Navigation links -->
  <button mat-button routerLink="/dashboard" routerLinkActive="active-link">
    <mat-icon>dashboard</mat-icon> Dashboard
  </button>
  <button mat-button routerLink="/vets" routerLinkActive="active-link">
    <mat-icon>medical_services</mat-icon> Vets
  </button>
  <button mat-button routerLink="/specialties" routerLinkActive="active-link">
    <mat-icon>local_hospital</mat-icon> Specialties
  </button>
  <button mat-button routerLink="/appointments" routerLinkActive="active-link">
    <mat-icon>event</mat-icon> Appointments
  </button>
</mat-toolbar>

<!-- Routed page content rendered here -->
<div class="app-content">
  <router-outlet></router-outlet>
</div>
