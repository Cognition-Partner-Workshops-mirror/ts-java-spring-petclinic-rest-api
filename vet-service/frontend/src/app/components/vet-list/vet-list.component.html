<!-- Veterinarians list view with Material table -->
<div class="vet-list-container">
  <div class="header-row">
    <h1>Veterinarians</h1>
  </div>

  <!-- Loading spinner while data is being fetched -->
  <div class="spinner-container" *ngIf="loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <!-- Vet table displayed after data loads -->
  <mat-card *ngIf="!loading">
    <table mat-table [dataSource]="vets" class="full-width-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let vet">{{ vet.id }}</td>
      </ng-container>

      <!-- First Name Column -->
      <ng-container matColumnDef="firstName">
        <th mat-header-cell *matHeaderCellDef>First Name</th>
        <td mat-cell *matCellDef="let vet">{{ vet.firstName }}</td>
      </ng-container>

      <!-- Last Name Column -->
      <ng-container matColumnDef="lastName">
        <th mat-header-cell *matHeaderCellDef>Last Name</th>
        <td mat-cell *matCellDef="let vet">{{ vet.lastName }}</td>
      </ng-container>

      <!-- Specialties Column - shows chips for each specialty -->
      <ng-container matColumnDef="specialties">
        <th mat-header-cell *matHeaderCellDef>Specialties</th>
        <td mat-cell *matCellDef="let vet">
          <mat-chip-list>
            <mat-chip *ngFor="let spec of vet.specialties" color="primary" selected>
              {{ spec.name }}
            </mat-chip>
            <span *ngIf="!vet.specialties || vet.specialties.length === 0" class="no-specialty">
              None assigned
            </span>
          </mat-chip-list>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Empty state message -->
    <div class="empty-state" *ngIf="vets.length === 0">
      <mat-icon>person_off</mat-icon>
      <p>No veterinarians found.</p>
    </div>
  </mat-card>
</div>
